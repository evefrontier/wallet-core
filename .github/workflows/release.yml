# Build and publish wallet-core to GitHub Package Registry on release. A manual
# run only builds.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Jobs declare the permissions they need; anything else gets none.
permissions: {}

# Release builds must not restore caches that other workflows could have
# written (cache poisoning). This covers the setup-bun and setup-node caches.
cache-mode: none

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Manual runs only build, so a dispatch can be used to test the
      # workflow without publishing. The token goes through env, not ${{ }}
      # in run. Trusted publishing is npmjs.com-only and doesn't apply to
      # GitHub Packages.
      - name: Publish
        if: github.event_name == 'release'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing]
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> .npmrc
          bun publish
