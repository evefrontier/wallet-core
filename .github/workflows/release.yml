# Build and pack wallet-core tarball on release or manual run.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack tarball
        run: bun pm pack

      - name: Locate tarball
        id: tarball
        run: |
          set -euo pipefail
          files=(*.tgz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .tgz file found after bun pm pack"
            exit 1
          fi
          if [ "${#files[@]}" -gt 1 ]; then
            echo "::error::Multiple .tgz files found: ${files[*]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.tarball.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-tarball
          path: ${{ steps.tarball.outputs.path }}
