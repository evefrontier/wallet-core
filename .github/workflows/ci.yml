name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Install Test Dependencies
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test:coverage

      - name: Build coverage summary
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'EOF'
          import {
            appendFileSync,
            mkdirSync,
            readFileSync,
            writeFileSync,
          } from 'node:fs'

          const summaryPath = 'coverage/coverage-summary.json'
          const summary = JSON.parse(readFileSync(summaryPath, 'utf8'))
          const total = summary.total

          const formatMetric = (metric) => {
            const percentage = Number(metric.pct).toFixed(2)
            return `| ${percentage}% | ${metric.covered} | ${metric.total} | ${metric.skipped} |`
          }

          const body = [
            '<!-- wallet-core-coverage-report -->',
            '## Coverage Report',
            '',
            '| Metric | Coverage | Covered | Total | Skipped |',
            '| --- | ---: | ---: | ---: | ---: |',
            `| Statements ${formatMetric(total.statements)}`,
            `| Branches ${formatMetric(total.branches)}`,
            `| Functions ${formatMetric(total.functions)}`,
            `| Lines ${formatMetric(total.lines)}`,
          ].join('\n')

          mkdirSync('coverage-report', { recursive: true })
          writeFileSync('coverage-report/comment.md', `${body}\n`)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`)
          EOF

      - name: Upload coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-core-coverage
          path: |
            coverage-report/comment.md
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 14

  report-coverage:
    needs: build
    # Keep this same-repository gate. Removing it gives forked PRs access to a
    # job with pull-requests: write, which can expose the repository to pwn-request risks.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download coverage
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallet-core-coverage
          path: .

      - name: Report Coverage
        if: ${{ steps.download-coverage.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from 'node:fs'

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          const issueNumber = Number(process.env.PR_NUMBER)
          const commentPath = 'coverage-report/comment.md'

          if (!existsSync(commentPath)) {
            console.log(`Coverage comment not found at ${commentPath}`)
            process.exit(0)
          }

          const body = readFileSync(commentPath, 'utf8').trim()
          const marker = '<!-- wallet-core-coverage-report -->'

          const request = async (url, init = {}) => {
            const response = await fetch(url, {
              ...init,
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
                ...(init.headers ?? {}),
              },
            })

            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}`)
            }

            if (response.status === 204) {
              return null
            }

            return response.json()
          }

          const commentsUrl = `${process.env.GITHUB_API_URL}/repos/${owner}/${repo}/issues/${issueNumber}/comments`
          const comments = await request(commentsUrl)
          const existing = comments.find((comment) =>
            typeof comment.body === 'string' && comment.body.includes(marker),
          )

          if (existing) {
            await request(
              `${process.env.GITHUB_API_URL}/repos/${owner}/${repo}/issues/comments/${existing.id}`,
              {
                method: 'PATCH',
                body: JSON.stringify({ body }),
              },
            )
          } else {
            await request(commentsUrl, {
              method: 'POST',
              body: JSON.stringify({ body }),
            })
          }
          EOF

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
